name: Android feature request
description: Suggest an improvement to the native Android app
body:
  - type: textarea
    id: problem
    attributes:
      label: What task are you trying to complete?
      description: Describe the workflow and where the current app gets in your way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain the expected result and any alternatives you considered.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: App, server and device context
      description: Include relevant versions and keep private terminal content out of the report.
