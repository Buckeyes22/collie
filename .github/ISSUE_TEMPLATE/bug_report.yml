name: Bug report
description: Something in the native Android app is broken
labels:
  - bug
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened, and what did you expect?
      description: Describe the bug. Include steps to reproduce if you have them.
    validations:
      required: true

  - type: textarea
    id: versions
    attributes:
      label: Android app and server versions
      description: Report the Android app build and connected server version separately.
    validations:
      required: true

  - type: textarea
    id: device
    attributes:
      label: Device and connection
      description: Device model, Android version, install source, multiplexer, and ingress type.
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Optional screenshots or sanitized diagnostics
      description: >
        Review evidence before sharing. Diagnostics can include terminal text and sent messages.
        Never include pairing codes, tokens, private host details, or sensitive terminal content.
    validations:
      required: false
