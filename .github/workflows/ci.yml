name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to a PR supersedes the old run — don't burn a runner on the stale one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: typecheck + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      # The MANDATORY invariant: the three version files + the newest CHANGELOG heading must agree.
      - name: Version consistency
        run: bash scripts/check-version.sh

      - name: Install (root)
        run: bun install --frozen-lockfile

      # Lint as early as it can actually run: oxlint lives in the ROOT node_modules, so the root
      # install has to come first — but nothing else does. It reads the one `.oxlintrc.json` at the
      # root (which already covers web/src, hence no second run after the web install) with no flags
      # of its own, exactly like the pre-commit hook and `collie build`. Cheap (<1s over the whole
      # tree) and placed before the typechecks and tests so a lint failure doesn't burn minutes on a
      # doomed run. This full-tree run is the authority when a narrower surface disagrees.
      - name: Lint
        run: bun run lint

      - name: Typecheck (root)
        run: bun run typecheck
      - name: Test (bridge)
        run: bun run test

      - name: Install (web)
        run: cd web && bun install --frozen-lockfile
      - name: Typecheck (web)
        run: cd web && bun run typecheck
      - name: Test (web)
        run: cd web && bun run test

  # The two-instance crew drill (integration/crew-harness.test.ts). ITS OWN JOB, and no `needs`, for
  # the same two reasons the browser tier has one. It is slow for a reason nothing can trim: it boots
  # twenty real child processes over real pinned TLS, because a certificate cannot be re-pinned on a
  # reload. Measured 2026-09-30, it was 58.3s of the 67.0s `check` spent on the backend, paid by every
  # developer on every push. Out here it costs wall clock nobody waits on, and a failure still lands
  # in the same run as a lint failure rather than behind it.
  crew:
    name: crew drill
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install (root)
        run: bun install --frozen-lockfile
      - name: Crew drill
        run: bun run test:crew

  # The browser tier (M26 spec 01). NO `needs`: a lint failure and a browser failure both have to
  # report in one run, so this job starts beside `check` rather than behind it. It installs only
  # `web/`, because Playwright is a devDependency of `web/` and of nothing else — the root tree
  # never grows a browser.
  #
  # `release.yml` deliberately gains none of this. It carries no lint step for the same class of
  # reason (release.yml:174-176: oxlint's allocator SIGABRTs below roughly 7 GB), and an operator
  # path must never download a browser.
  e2e:
    name: browser (chromium, webkit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install (web)
        run: cd web && bun install --frozen-lockfile

      # The version is READ OUT OF THE LOCKFILE, never hard-coded: `web/bunfig.toml` holds a 7-day
      # supply-chain cooldown, so which Playwright resolves is not something this file can know. A
      # bumped dependency therefore invalidates the cache on its own.
      - name: Resolve the Playwright version
        id: pw
        run: |
          version="$(grep -m1 -oE '"@playwright/test@[0-9]+\.[0-9]+\.[0-9]+"' web/bun.lock | tr -d '"' | cut -d@ -f3)"
          test -n "${version}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      # The first cache in this workflow. Chromium plus its headless shell is ~170 MB, WebKit
      # another ~90 MB, and the download is the slowest thing in this job by an order of magnitude.
      - name: Cache Chromium and WebKit
        id: browser-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-chromium-webkit-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # Chromium and WebKit: the Safari engine runs the `app` specs at phone size too
      # (`web/playwright.config.ts`, `app-phone-webkit`, always on under CI). `--with-deps` pulls the
      # system libraries the runner image lacks, and it is needed on a cache HIT too: the cache
      # carries the browsers under $HOME, never the apt packages.
      - name: Install Chromium and WebKit
        if: steps.browser-cache.outputs.cache-hit != 'true'
        run: cd web && bunx playwright install --with-deps chromium webkit
      - name: Install browser system dependencies
        if: steps.browser-cache.outputs.cache-hit == 'true'
        run: cd web && bunx playwright install-deps chromium webkit

      # `e2e` runs `vite build` first: the tier serves the SHIPPED bundle off disk, because the
      # service worker exists only in a real build.
      - name: E2E (tier 1)
        run: cd web && bun run e2e

      - name: Upload the failure artefacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-artefacts
          path: |
            web/test-results
            web/playwright-report
          retention-days: 7
          if-no-files-found: ignore

  android:
    name: Native Android test + lint + debug build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install pinned Android CLI from Google's signed repository
        run: |
          set -euo pipefail
          test "$(dpkg --print-architecture)" = amd64
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://dl.google.com/linux/linux_signing_key.pub | sudo tee /etc/apt/keyrings/google.asc >/dev/null
          printf '%s\n' 'deb [arch=amd64 signed-by=/etc/apt/keyrings/google.asc] https://dl.google.com/android/cli/latest/debian/ stable main' | sudo tee /etc/apt/sources.list.d/android-cli.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y android-cli=1.0.16500706
          test "$(android --no-metrics --version)" = 1.0.16500706

      - name: Install Android SDK 37.2
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?Runner Android SDK path is required}"
          # Accept SDK license prompts in CI; preserve the CLI exit status if yes gets SIGPIPE.
          (set +o pipefail; yes | android --no-metrics --sdk="$ANDROID_HOME" sdk install platform-tools platforms/android-37.2@1 build-tools/37.0.0 ndk/27.1.12297006 cmake/3.22.1)
          test -s "$ANDROID_HOME/licenses/android-sdk-license"

      - name: Validate native Android configuration
        run: |
          bun run check:android
          bun scripts/android-dependency-notices.ts --check
          cmp LICENSE android/app/src/main/res/raw/license_collie.txt

      - name: Documentation links
        run: bun scripts/check-doc-links.ts

      - name: Native unit tests, lint, and debug build
        run: cd android && ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug

      - name: Validate merged Android manifest
        run: |
          test -f android/app/build/intermediates/merged_manifest/debug/processDebugMainManifest/AndroidManifest.xml
          bun run check:android
